# TEMPORARY probe for #154 — reads the live listing through asc, writes nothing.
name: App Store Metadata

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which listing
        type: choice
        options: [all, ios, macos, visionos]
        default: all
      apply:
        description: Upload (unticked, only the diff is shown)
        type: boolean
        default: false

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY }}
      ASC_VERSION: "5.14.0"
      APP: "6798677334"
    steps:
      - uses: actions/checkout@v7
      - name: Install asc
        run: |
          base="https://github.com/rorkai/App-Store-Connect-CLI/releases/download/$ASC_VERSION"
          curl -fsSLO "$base/asc_${ASC_VERSION}_linux_amd64"
          curl -fsSLO "$base/asc_${ASC_VERSION}_checksums.txt"
          grep " asc_${ASC_VERSION}_linux_amd64\$" "asc_${ASC_VERSION}_checksums.txt" | sha256sum -c -
          install -m 755 "asc_${ASC_VERSION}_linux_amd64" /usr/local/bin/asc
          asc --version
      - name: Probe
        run: |
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 -d > "$RUNNER_TEMP/key.p8"
          export ASC_PRIVATE_KEY_PATH="$RUNNER_TEMP/key.p8" ASC_BYPASS_KEYCHAIN=1
          mkdir -p probe
          set -x
          asc versions list --app "$APP" --paginate --output json > probe/versions.json || true
          jq -c '.data[] | {id, p: .attributes.platform, v: .attributes.versionString, s: (.attributes.appStoreState // .attributes.appVersionState)}' probe/versions.json || head -c 2000 probe/versions.json
          for p in IOS MAC_OS VISION_OS; do
            vid=$(jq -r --arg p "$p" '[.data[] | select(.attributes.platform==$p)] | sort_by(.attributes.createdDate) | last | .id' probe/versions.json)
            echo "== $p $vid"
            asc screenshots list --app "$APP" --version-id "$vid" --platform "$p" --output json > "probe/shots-$p.json" || true
            asc migrate export --app "$APP" --version-id "$vid" --output-dir "probe/export-$p" --output json > "probe/export-$p.json" || true
            asc localizations list --version "$vid" --output json > "probe/locs-$p.json" || true
          done
          find probe -type f | sort
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: probe
