name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# macos-26 everywhere: the app deploys to macOS 26 / iOS 26, and compiling
# the Icon Composer app icon for macOS needs the host's own icon rendering —
# on the macOS 15 image actool's AssetCatalogAgent-AssetRuntime crashed on
# the .icns variant while the iOS one built fine. It also puts CI on the same
# Xcode 26.6 as local development.
jobs:
  # A signing team must never reach the repository. It is not a secret — a
  # Team ID sits in every distributed app's provisioning profile — but a fork
  # that inherits someone else's team meets signing errors it cannot fix.
  # The team lives in the gitignored Support/Local.xcconfig instead (see
  # Support/Signing.xcconfig). This is a grep rather than a build setting
  # because Xcode writes DEVELOPMENT_TEAM straight into project.pbxproj the
  # moment a team is picked in Signing & Capabilities, and no setting can
  # enforce its own absence.
  signing-hygiene:
    name: Signing Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: No development team in the project
        run: |
          if grep -n 'DEVELOPMENT_TEAM' TortoiseBlocks.xcodeproj/project.pbxproj; then
            echo "::error::DEVELOPMENT_TEAM leaked into project.pbxproj — move it to Support/Local.xcconfig (gitignored)."
            exit 1
          fi
          if [ -f Support/Local.xcconfig ]; then
            echo "::error::Support/Local.xcconfig is committed — it is meant to stay local."
            exit 1
          fi

  # What App Store Connect refuses that is knowable from the files alone.
  # deliver finds it mid-upload, and only when someone runs it by hand — too
  # late and too rare to be the first check. Plain Ruby, so no bundle install:
  # the job is a checkout and a second.
  appstore-metadata:
    name: App Store Metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check appstore/
        run: ruby fastlane/metadata_check.rb --github

  format-lint:
    name: Format Lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: swift format lint
        run: |
          swift format lint --strict --parallel --recursive \
            App ThumbnailExtension TortoiseBlocksKit/Sources TortoiseBlocksKit/Tests
          swift format lint --strict TortoiseBlocksKit/Package.swift

  kit-test:
    name: Kit Tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Cache SwiftPM build directory
        uses: actions/cache@v6
        with:
          path: TortoiseBlocksKit/.build
          key: spm-kit-${{ runner.os }}-${{ hashFiles('TortoiseBlocksKit/Package.resolved') }}
          restore-keys: spm-kit-${{ runner.os }}-

      - name: Test
        working-directory: TortoiseBlocksKit
        run: swift test

  app-build:
    name: App Build (${{ matrix.name }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            destination: generic/platform=iOS Simulator
          - name: macOS
            destination: platform=macOS
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Build
        run: |
          xcodebuild -project TortoiseBlocks.xcodeproj -scheme TortoiseBlocks \
            -destination '${{ matrix.destination }}' \
            CODE_SIGNING_ALLOWED=NO -quiet build
