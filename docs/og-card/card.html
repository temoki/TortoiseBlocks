<!doctype html><meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; display: flex; align-items: center; gap: 56px;
    padding: 0 72px; overflow: hidden;
    font: 16px -apple-system, BlinkMacSystemFont, sans-serif; color: #1c1c1e;
    background:
      radial-gradient(60% 90% at 88% 50%, #f3e9fd 0%, rgba(243,233,253,0) 70%),
      linear-gradient(160deg, #eaf6fd 0%, #ffffff 45%, #eefaf1 100%);
  }
  .text { flex: 1; }
  .brand { display: flex; align-items: center; gap: 20px; }
  .brand img { width: 104px; height: 104px; border-radius: 23px;
               box-shadow: 0 8px 26px rgba(28,28,30,.14); }
  .brand b { font-size: 46px; font-weight: 700; letter-spacing: -.02em; }
  h1 { margin-top: 34px; font-size: 40px; line-height: 1.28; font-weight: 600;
       letter-spacing: -.015em; max-width: 12em; }
  p { margin-top: 22px; font-size: 23px; color: #5b5b60; }
  p b { color: #b64ae5; font-weight: 600; }
  .star { width: 430px; display: flex; justify-content: center; }
  .star img { width: 100%; height: auto; }
</style>
<div class="text">
  <div class="brand"><img src="icon.png"><b>Tortoise Blocks</b></div>

</div>
